[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crusher-backend"
version = "0.3.0"
description = "金融话术粉碎机 Demo - FastAPI 服务端"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "httpx>=0.27.0",
  "pypdf>=5.0.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0",
  "pyright>=1.1.380",
]
mcp = [
  "mcp>=1.9,<2",
]

[project.scripts]
crusher-api = "app.main:run"
crusher-mcp = "app.interfaces.mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = [".", "..", "../legacy"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["app"]
exclude = ["app/interfaces/mcp/server.py"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingImports = true
venvPath = "."
venv = ".venv"
